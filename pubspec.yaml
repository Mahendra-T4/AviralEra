name: online_course
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  alert_info: ^0.0.8
  bloc: ^9.2.1
  connectivity_plus: ^7.2.0
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  equatable: ^2.0.8
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_launcher_icons: ^0.14.4
  fluttertoast: ^8.2.1
  get_it: ^9.2.1
  go_router: ^17.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  image_picker: ^1.2.3
  in_app_review: ^2.0.12
  logger: ^2.7.0
  provider: ^6.0.0
  riverpod: ^3.2.1
  share_plus: ^12.0.2
  url_launcher: ^6.2.0
  video_player: ^2.11.1
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/AviralEraLogo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/fonts/
    - assets/animations/

  # example:
  fonts:
    - family: PoppinsSemiBold
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf

    #         style: italic
    - family: PoppinsMedium
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg


  # example:
  # fonts:
  #   - family: Schyler
